[project]
name = "subwaypulse"
version = "1.0.0"
description = "Live NYC subway service health from MTA GTFS-realtime feeds: trains running, headways and service gaps per line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gtfs-realtime-bindings>=1.0", "httpx>=0.27", "truststore>=0.9", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.11", "types-protobuf"]

[project.scripts]
subwaypulse = "subwaypulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subwaypulse"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/subwaypulse/report.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.transit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=subwaypulse --cov-report=term-missing"
